<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lume Online Menu</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <header>

        <h1 class="logo">Lume</h1>

        <p class="subtitle">ONLINE MENU</p>

    </header>


    <div class="top-panel">

        <div class="menu-switch">

            <button class="menu-btn active"
                    data-menu="menu">
                Main Menu
            </button>

            <button class="menu-btn"
                    data-menu="bar">
                Bar Menu
            </button>

        </div>


        <div class="language-switch">

            <button class="lang-btn active"
                    data-lang="en">
                EN
            </button>

            <button class="lang-btn"
                    data-lang="ru">
                RU
            </button>

            <button class="lang-btn"
                    data-lang="kz">
                KZ
            </button>

        </div>

    </div>


    <main id="gallery" class="gallery">

        <!-- JS вставит изображения -->

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
